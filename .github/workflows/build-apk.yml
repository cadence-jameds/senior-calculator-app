name: Build Formal Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find formal release ZIP
        shell: bash
        run: |
          ZIP_FILE="senior-calculator-app-v1.0.0-release.zip"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using $ZIP_FILE"

      - name: Unzip Android project
        run: |
          rm -rf build_source
          mkdir build_source
          unzip -q "$ZIP_FILE" -d build_source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        working-directory: build_source
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          cp build_source/app/build/outputs/apk/release/app-release.apk \
             Senior-Calculator-v1.0.0.apk

      - name: Upload formal APK
        uses: actions/upload-artifact@v4
        with:
          name: Senior-Calculator-v1.0.0
          path: Senior-Calculator-v1.0.0.apk
          if-no-files-found: error
